services:
  - type: web
    name: banking-chatbot-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python ../data_generator/generate_banking_docs.py || true
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: CHROMA_PERSIST_DIR
        value: /opt/render/project/src/chroma_db
      - key: CHROMA_COLLECTION_NAME
        value: banking_docs
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: TOP_K_RESULTS
        value: "5"
      - key: MAX_HISTORY_TURNS
        value: "10"
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: banking-chatbot-frontend
    env: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          name: banking-chatbot-backend
          type: web
          property: host
          prefix: "https://"
          suffix: "/api/v1"
